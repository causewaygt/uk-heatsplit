name: Cooling fit (manual)

# Hand-run analysis, NOT part of the daily build. Trigger it from the Actions
# tab: pick this workflow, press "Run workflow". It fetches dewpoint from
# Open-Meteo, runs the cooling regression against the retro store, and prints
# everything to the run log. Nothing is committed and no site file changes.

on:
  workflow_dispatch:
    inputs:
      # Must COVER the archive, or the humidity terms are fitted on a subset
      # while every other term uses the whole record - fit_cooling.py warns
      # when coverage falls under 95% because the incremental R2 is then not
      # comparable across terms. The archive is 1,010 days (three summers);
      # 1,100 covers it with room as it grows.
      days:
        description: "Days of history to fetch and fit (must cover the archive)"
        required: false
        default: "1100"
      skip_humidity:
        description: "Run without humidity (control fit only)"
        required: false
        default: "false"

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Psychrometric self-test (no network)
        run: python3 analysis/fetch_humidity.py --selftest

      - name: Fetch dewpoint and enthalpy days
        if: ${{ github.event.inputs.skip_humidity != 'true' }}
        run: |
          python3 analysis/fetch_humidity.py \
            --days ${{ github.event.inputs.days }} \
            --out analysis/humidity.json

      # AGAINST THE ARCHIVE, not the rolling window. docs/retro.json is capped
      # at 800 days and trims from the front, so a fit taken from it holds two
      # complete summers and cannot be reproduced once the window has moved.
      # docs/daily.json is append-only and currently carries three. Falls back
      # to retro.json if the archive is absent.
      - name: Fit the cooling limb
        run: |
          SRC=docs/daily.json
          [ -f "$SRC" ] || SRC=docs/retro.json
          echo "fitting against $SRC"
          if [ -f analysis/humidity.json ]; then
            python3 analysis/fit_cooling.py "$SRC" analysis/humidity.json
          else
            python3 analysis/fit_cooling.py "$SRC"
          fi

      - name: Keep the humidity series as a downloadable artefact
        if: ${{ github.event.inputs.skip_humidity != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: humidity-series
          path: analysis/humidity.json
          retention-days: 30
