name: Update heat split

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Build data.json
        run: python scripts/build.py

      # OFFLINE ANALYSIS, not part of the site. build.py writes
      # analysis/gas_daily.json as a by-product; this reads it while it still
      # exists on the runner, so nothing derived has to be committed.
      #
      # continue-on-error because this is an experiment sitting inside a
      # production build: if the estimator throws, the site must still publish
      # and the failure marker below must not fire.
      - name: Balance-point spread (offline)
        continue-on-error: true
        run: |
          if [ -f analysis/gas_daily.json ]; then
            python3 analysis/fit_balance_spread.py analysis/gas_daily.json
          else
            echo "no analysis/gas_daily.json - build.py did not write it"
          fi

      - name: Commit and push
        run: |
          git config user.name "heatsplit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          [ -f docs/retro.json ] && git add docs/retro.json || true
          git commit -m "data update $(date -u +%F)" || echo "no change"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push

      - name: Failure marker
        if: failure()
        run: |
          echo "::error::heatsplit daily build failed - check feed status"
          curl -s -d "uk-heatsplit daily build FAILED $(date -u +%F) - check Actions log" ntfy.sh/uk-heatsplit-simon-a7k2
        continue-on-error: true
