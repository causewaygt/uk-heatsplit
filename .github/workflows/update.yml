name: Update heat split

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Build data.json
        run: python scripts/build.py

      # OFFLINE ANALYSIS, not part of the site. build.py writes
      # analysis/gas_daily.json as a by-product; this reads it while it still
      # exists on the runner, so nothing derived has to be committed.
      #
      # continue-on-error because this is an experiment sitting inside a
      # production build: if the estimator throws, the site must still publish
      # and the failure marker below must not fire.
      # Twenty-five years of GB cooling degree days. Past years never
      # change, so --if-stale 30 means this actually fetches about once a
      # month and is a no-op on every other run. It is deliberately NOT a
      # hard failure: a missing cdd_history.json costs one chart, where a
      # failed step would cost the whole nightly data update.
      - name: Cooling degree-day history (refreshes ~monthly)
        continue-on-error: true
        run: python3 scripts/cdd_history.py --years 25
             --out docs/cdd_history.json --if-stale 30

      - name: Balance-point spread (offline)
        continue-on-error: true
        run: |
          if [ -f analysis/gas_daily.json ]; then
            python3 analysis/fit_balance_spread.py analysis/gas_daily.json
          else
            echo "no analysis/gas_daily.json - build.py did not write it"
          fi

      - name: Commit and push
        run: |
          git config user.name "heatsplit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          [ -f docs/retro.json ] && git add docs/retro.json || true
          # The append-only daily archive. build.py's hook rewrites this every
          # run, so it MUST be staged: an unstaged change here aborts the
          # 'pull --rebase' below with exit 128 and fails the whole build,
          # which is what happened on 22 Oct 2026. It must also be COMMITTED
          # to do its job at all - the runner checks out fresh each night, so
          # an uncommitted archive is rebuilt from the rolling retro window
          # every time and never grows past it.
          [ -f docs/daily.json ] && git add docs/daily.json || true
          # Written about monthly by the degree-day history step above; it
          # must be staged or the runner's fresh checkout discards it and the
          # step rebuilds it from scratch every month for nothing.
          [ -f docs/cdd_history.json ] && git add docs/cdd_history.json || true
          git commit -m "data update $(date -u +%F)" || echo "no change"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push

      - name: Failure marker
        if: failure()
        run: |
          echo "::error::heatsplit daily build failed - check feed status"
          curl -s -d "uk-heatsplit daily build FAILED $(date -u +%F) - check Actions log" ntfy.sh/uk-heatsplit-simon-a7k2
        continue-on-error: true
